[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lathe-pilot"
version = "0.1.0"
description = "LatheOS Screen Pilot — local, on-device on-screen guidance (capture -> plan -> ground -> guide). Fully local, no cloud."
readme = "README.md"
requires-python = ">=3.11"
# ZERO third-party runtime deps on purpose. Everything the pilot needs is
# either stdlib (urllib for the loopback HTTP calls to Ollama / LocateAnything,
# subprocess for grim / ydotool / eww / piper) or an external binary placed on
# PATH by modules/screen-pilot.nix. This keeps the package buildable straight
# from nixpkgs with no PyPI fetch and import-safe on any box.
dependencies = []

[project.scripts]
# Entrypoint wired by modules/screen-pilot.nix as `lathe-pilot`.
lathe-pilot = "lathe_pilot.__main__:main"

[tool.setuptools.packages.find]
include = ["lathe_pilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
